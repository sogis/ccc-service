name: CI

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
  workflow_call:
    inputs:
      release_tag:
        description: 'Release tag for Docker image'
        required: false
        type: string

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: 25
        distribution: temurin
    - name: Code quality checks
      run: ./gradlew spotbugsMain spotbugsTest
    - name: Run tests
      run: ./gradlew test
    - name: Run integration tests
      run: ./gradlew integrationTest

  release:
    if: inputs.release_tag != ''
    needs: test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: 25
        distribution: temurin
    - name: Build ccc-service.jar
      run: ./gradlew assemble
    - name: Docker login
      env:
        CCC_DOCKER_USER: ${{ secrets.CCC_DOCKER_USER }}
        CCC_DOCKER_PASS: ${{ secrets.CCC_DOCKER_PASS }}
      run: echo "$CCC_DOCKER_PASS" | docker login -u "$CCC_DOCKER_USER" --password-stdin
    - name: Build and test image
      run: ./gradlew testImage
      env:
        RELEASE_TAG: ${{ inputs.release_tag }}
    # Push the version tag first: Docker Scout can only attach attestations to pushed images.
    # 'latest' is set only after the CVE check has passed.
    - name: Push version tag to Docker Hub
      run: ./gradlew pushImage
      env:
        RELEASE_TAG: ${{ inputs.release_tag }}
    # Docker Scout only matches product ids of the tag an image is referenced by
    # (pkg:docker/<repo>@<tag>; digest ids and subcomponents did not match in tests), so the
    # committed VEX is regenerated with the version tag and 'latest' added as products.
    - name: Generate image-specific VEX
      run: |
        mkdir -p "$RUNNER_TEMP/vex"
        version=$(python3 -c 'import json; print(json.load(open("docs/security/ccc-service.openvex.json"))["version"])')
        python3 docs/security/generate_vex.py --version "${version}" \
          --product "pkg:docker/sogis/ccc-service@${RELEASE_TAG}" \
          --product "pkg:docker/sogis/ccc-service@latest" \
          --output "$RUNNER_TEMP/vex/ccc-service.vex.json"
      env:
        RELEASE_TAG: ${{ inputs.release_tag }}
    - name: Attach VEX attestation via Docker Scout
      uses: docker/scout-action@v1.30.0
      with:
        command: attestation-add
        image: sogis/ccc-service:${{ inputs.release_tag }}
        file: ${{ runner.temp }}/vex/ccc-service.vex.json
        predicate-type: https://openvex.dev/ns/v0.2.0
        dockerhub-user: ${{ secrets.CCC_DOCKER_USER }}
        dockerhub-password: ${{ secrets.CCC_DOCKER_PASS }}
        registry-write-user: ${{ secrets.CCC_DOCKER_USER }}
        registry-write-password: ${{ secrets.CCC_DOCKER_PASS }}
    # Fails on HIGH/CRITICAL CVEs that are not assessed (not_affected) in the VEX.
    - name: Verify CVEs with VEX applied
      uses: docker/scout-action@v1.30.0
      with:
        command: cves
        image: sogis/ccc-service:${{ inputs.release_tag }}
        only-severities: critical,high
        exit-code: true
        vex-location: ${{ runner.temp }}/vex
        # Scout only accepts VEX authors matching '<.*@docker.com>' by default;
        # must match "author" in generate_vex.py.
        vex-author: sogis
        dockerhub-user: ${{ secrets.CCC_DOCKER_USER }}
        dockerhub-password: ${{ secrets.CCC_DOCKER_PASS }}
    # Copy the tag registry-side so 'latest' points to exactly the verified (and attested) image.
    - name: Tag verified image as latest
      run: docker buildx imagetools create -t sogis/ccc-service:latest "sogis/ccc-service:${RELEASE_TAG}"
      env:
        RELEASE_TAG: ${{ inputs.release_tag }}
